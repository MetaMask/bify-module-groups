name: Lint and Test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 12.x
          - 14.x
          - 16.x
          - 18.x
          - 20.x
          - 22.x
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: yarn
    - run: yarn --ignore-engines --frozen-lockfile
    - run: yarn lint
    - run: yarn test
    - name: Validate RC changelog
      if: ${{ matrix.node-version == '20.x' && startsWith(github.head_ref, 'release/') }}
      run: yarn auto-changelog validate --prettier --rc
    - name: Validate changelog
      if: ${{ matrix.node-version == '20.x' && !startsWith(github.head_ref, 'release/') }}
      run: yarn auto-changelog validate --prettier
    - name: Require clean working directory
      shell: bash
      run: |
        if ! git diff --exit-code; then
          echo "Working tree dirty after building"
          exit 1
        fi
  all-jobs-pass:
    name: All jobs pass
    runs-on: ubuntu-latest
    needs:
      - lint-test
    steps:
      - run: echo "Great success!"
